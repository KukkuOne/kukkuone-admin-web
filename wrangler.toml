name = "kukkuone-admin-web"
compatibility_date = "2026-09-23"

# Served only at its own address, behind Cloudflare Access (Zero Trust):
# the workers.dev address is switched off so there is no unprotected way in.
workers_dev = false
preview_urls = false
routes = [{ pattern = "kukkuone-admin.naptrixlabs.com", custom_domain = true }]

# A single-page app served from the edge. not_found_handling sends every
# unknown path to index.html so client-side routing works on a hard refresh.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[observability]
enabled = true
